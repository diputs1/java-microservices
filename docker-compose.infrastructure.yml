name: java-microservices-infrastructure

services:
  identitydb:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: identitydb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Passw0rd!"
    ports:
      - "1434:1433"
    volumes:
      - identity_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  orderdb:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: orderdb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Passw0rd!"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  productdb:
    image: mysql:8.0.29
    container_name: productdb
    environment:
      MYSQL_ROOT_PASSWORD: "Passw0rd!"
      MYSQL_DATABASE: productdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pPassw0rd!"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  customerdb:
    image: postgres:16-alpine
    container_name: customerdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Passw0rd!"
      POSTGRES_DB: customerdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customerdb"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  basketdb:
    image: redis:7-alpine
    container_name: basketdb
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  inventorydb:
    image: mongo:7
    container_name: inventorydb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.2
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.2
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.2
    container_name: elasticsearch-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        curl -fsS -X PUT http://elasticsearch:9200/_template/microservices-local
        -H 'Content-Type: application/json'
        --data-binary '{"index_patterns":["microservices-*"],"settings":{"number_of_shards":1,"number_of_replicas":0}}'
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent-bit
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - fluent_bit_data:/fluent-bit/storage
      - fluent_bit_logs:/var/log/fluent-bit
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: "Passw0rd!"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      customerdb:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: java_microservices
    driver: bridge

volumes:
  identity_sqlserver_data:
    name: identity_sqlserver_data
  sqlserver_data:
    name: sqlserver_data
  mysql_data:
    name: mysql_data
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  mongo_data:
    name: mongo_data
  rabbitmq_data:
    name: rabbitmq_data
  elasticsearch_data:
    name: elasticsearch_data
  fluent_bit_data:
    name: fluent_bit_data
  fluent_bit_logs:
    name: fluent_bit_logs
  pgadmin_data:
    name: pgadmin_data
