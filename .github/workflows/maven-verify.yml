name: Maven Verify

on:
  pull_request:
    branches:
      - developer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven reactor
        run: mvn -B -ntp verify
