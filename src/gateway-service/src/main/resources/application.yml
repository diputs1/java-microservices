server:
  port: 5000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:5001}
          predicates:
            - Path=/api/v1/identity/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:5002}
          predicates:
            - Path=/api/v1/products/**
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:5003}
          predicates:
            - Path=/api/v1/customers/**
        - id: basket-service
          uri: ${BASKET_SERVICE_URL:http://localhost:5004}
          predicates:
            - Path=/api/v1/baskets/**
        - id: ordering-service
          uri: ${ORDERING_SERVICE_URL:http://localhost:5005}
          predicates:
            - Path=/api/v1/orders/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:5006}
          predicates:
            - Path=/api/v1/inventory/**
        - id: background-job-service
          uri: ${BACKGROUND_JOB_SERVICE_URL:http://localhost:5007}
          predicates:
            - Path=/api/v1/jobs/**
        - id: email-service
          uri: ${EMAIL_SERVICE_URL:http://localhost:5008}
          predicates:
            - Path=/api/v1/email/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
