server:
  port: 5002

spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/productdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8080/realms/microservices}
    audiences:
      - ${APP_SECURITY_AUDIENCE:microservices-api}
    client-id: ${APP_SECURITY_CLIENT_ID:product-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
