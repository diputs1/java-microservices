server:
  port: 5004

spring:
  application:
    name: basket-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

basket:
  ttl: ${BASKET_TTL:PT30M}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8080/realms/microservices}
    audiences:
      - ${APP_SECURITY_AUDIENCE:microservices-api}
    client-id: ${APP_SECURITY_CLIENT_ID:basket-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
