server:
  port: 5007

spring:
  application:
    name: background-job-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/jobdb}
      auto-index-creation: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${SPRING_RABBITMQ_LISTENER_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${SPRING_RABBITMQ_LISTENER_RETRY_INITIAL_INTERVAL:1000}
          multiplier: ${SPRING_RABBITMQ_LISTENER_RETRY_MULTIPLIER:2}
          max-interval: ${SPRING_RABBITMQ_LISTENER_RETRY_MAX_INTERVAL:10000}

app:
  mail:
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  github-summary:
    enabled: ${APP_GITHUB_SUMMARY_ENABLED:true}
    cron: ${APP_GITHUB_SUMMARY_CRON:0 0 9 * * *}
    zone: ${APP_GITHUB_SUMMARY_ZONE:UTC}
    recipient: ${APP_GITHUB_SUMMARY_RECIPIENT:dotung318@gmail.com}
    query: ${APP_GITHUB_SUMMARY_QUERY:ai developer code assistant}
    limit: ${APP_GITHUB_SUMMARY_LIMIT:5}
    api-base-url: ${APP_GITHUB_SUMMARY_API_BASE_URL:https://api.github.com}
    token: ${APP_GITHUB_SUMMARY_TOKEN:${GITHUB_TOKEN:}}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8080/realms/microservices}
    audiences:
      - ${APP_SECURITY_AUDIENCE:microservices-api}
    client-id: ${APP_SECURITY_CLIENT_ID:background-job-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
