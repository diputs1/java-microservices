services:
  identitydb:
    container_name: identitydb
    environment:
      SA_PASSWORD: "Passw0rd!"
      ACCEPT_EULA: "Y"
    restart: always
    volumes:
      - identity_sqlserver_data:/var/opt/mssql
    ports:
      - "1434:1433"

  orderdb:
    container_name: orderdb
    environment:
      SA_PASSWORD: "Passw0rd!"
      ACCEPT_EULA: "Y"
    restart: always
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1435:1433"

  productdb:
    container_name: productdb
    environment:
      MYSQL_ROOT_PASSWORD: "Passw0rd!"
      MYSQL_DATABASE: productdb
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  customerdb:
    container_name: customerdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Passw0rd!"
      POSTGRES_DB: customerdb
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  basketdb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"

  inventorydb:
    container_name: inventorydb
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  pgadmin:
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: "Passw0rd!"
    restart: always
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"

  portainer:
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"

  elasticsearch:
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    restart: always
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  kibana:
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: always
    ports:
      - "5601:5601"

  gateway-service:
    container_name: gateway-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/gateway-service
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002
      CUSTOMER_SERVICE_URL: http://customer-service:5003
      BASKET_SERVICE_URL: http://basket-service:5004
      ORDERING_SERVICE_URL: http://ordering-service:5005
      INVENTORY_SERVICE_URL: http://inventory-service:5006
      BACKGROUND_JOB_SERVICE_URL: http://background-job-service:5007
      EMAIL_SERVICE_URL: http://email-service:5008
    depends_on:
      - identity-service
      - product-service
      - customer-service
      - basket-service
      - ordering-service
      - inventory-service
      - background-job-service
      - email-service
    ports:
      - "5000:5000"

  identity-service:
    container_name: identity-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/Services/identity-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://identitydb:1433;databaseName=master;encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "Passw0rd!"
    depends_on:
      - identitydb
    ports:
      - "5001:5001"

  product-service:
    container_name: product-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/Services/product-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://productdb:3306/productdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Passw0rd!"
    depends_on:
      - productdb
    ports:
      - "5002:5002"

  customer-service:
    container_name: customer-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/Services/customer-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://customerdb:5432/customerdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "Passw0rd!"
    depends_on:
      - customerdb
    ports:
      - "5003:5003"

  basket-service:
    container_name: basket-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/Services/basket-service
    environment:
      SPRING_DATA_REDIS_HOST: basketdb
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - basketdb
    ports:
      - "5004:5004"

  ordering-service:
    container_name: ordering-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/Services/ordering-service
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://orderdb:1433;databaseName=master;encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "Passw0rd!"
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - orderdb
      - rabbitmq
    ports:
      - "5005:5005"

  inventory-service:
    container_name: inventory-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/Services/inventory-service
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://inventorydb:27017/inventorydb
    depends_on:
      - inventorydb
    ports:
      - "5006:5006"

  background-job-service:
    container_name: background-job-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/background-job-service
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://inventorydb:27017/jobdb
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - inventorydb
      - rabbitmq
    ports:
      - "5007:5007"

  email-service:
    container_name: email-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE_PATH: src/Services/email-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    ports:
      - "5008:5008"
