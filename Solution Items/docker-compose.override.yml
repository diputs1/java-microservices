services:
  identitydb:
    container_name: identitydb
    environment:
      MSSQL_SA_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      ACCEPT_EULA: "Y"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: always
    volumes:
      - identity_sqlserver_data:/var/opt/mssql
    ports:
      - "1434:1433"

  orderdb:
    container_name: orderdb
    environment:
      MSSQL_SA_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      ACCEPT_EULA: "Y"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: always
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1435:1433"

  productdb:
    container_name: productdb
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      MYSQL_DATABASE: productdb
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  customerdb:
    container_name: customerdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      POSTGRES_DB: customerdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customerdb"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  basketdb:
    container_name: basketdb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always
    ports:
      - "6379:6379"

  inventorydb:
    container_name: inventorydb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  rabbitmq:
    container_name: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  pgadmin:
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    restart: always
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"

  portainer:
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"

  elasticsearch:
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    restart: always
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always
    ports:
      - "5601:5601"

  gateway-service:
    image: java-microservices/gateway-service:latest
    container_name: gateway-service
    build:
      context: ..
      dockerfile: src/gateway-service/Dockerfile
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002
      CUSTOMER_SERVICE_URL: http://customer-service:5003
      BASKET_SERVICE_URL: http://basket-service:5004
      ORDERING_SERVICE_URL: http://ordering-service:5005
      INVENTORY_SERVICE_URL: http://inventory-service:5006
      BACKGROUND_JOB_SERVICE_URL: http://background-job-service:5007
      EMAIL_SERVICE_URL: http://email-service:5008
    depends_on:
      identity-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      basket-service:
        condition: service_healthy
      ordering-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      background-job-service:
        condition: service_healthy
      email-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5000:5000"

  identity-service:
    image: java-microservices/identity-service:latest
    container_name: identity-service
    build:
      context: ..
      dockerfile: src/Services/identity-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://identitydb:1433;databaseName=master;encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
    depends_on:
      identitydb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5001:5001"

  product-service:
    image: java-microservices/product-service:latest
    container_name: product-service
    build:
      context: ..
      dockerfile: src/Services/product-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://productdb:3306/productdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
    depends_on:
      productdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5002/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5002:5002"

  customer-service:
    image: java-microservices/customer-service:latest
    container_name: customer-service
    build:
      context: ..
      dockerfile: src/Services/customer-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://customerdb:5432/customerdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
    depends_on:
      customerdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5003/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5003:5003"

  basket-service:
    image: java-microservices/basket-service:latest
    container_name: basket-service
    build:
      context: ..
      dockerfile: src/Services/basket-service/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: basketdb
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      basketdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5004/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5004:5004"

  ordering-service:
    image: java-microservices/ordering-service:latest
    container_name: ordering-service
    build:
      context: ..
      dockerfile: src/Services/ordering-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://orderdb:1433;databaseName=master;encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      BASKET_SERVICE_URL: http://basket-service:5004
      INVENTORY_SERVICE_URL: http://inventory-service:5006
    depends_on:
      orderdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      basket-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5005/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5005:5005"

  inventory-service:
    image: java-microservices/inventory-service:latest
    container_name: inventory-service
    build:
      context: ..
      dockerfile: src/Services/inventory-service/Dockerfile
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://inventorydb:27017/inventorydb
    depends_on:
      inventorydb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5006/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5006:5006"

  background-job-service:
    image: java-microservices/background-job-service:latest
    container_name: background-job-service
    build:
      context: ..
      dockerfile: src/background-job-service/Dockerfile
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://inventorydb:27017/jobdb
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      inventorydb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5007/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5007:5007"

  email-service:
    image: java-microservices/email-service:latest
    container_name: email-service
    build:
      context: ..
      dockerfile: src/Services/email-service/Dockerfile
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5008/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "5008:5008"
